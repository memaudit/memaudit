version: "3"

tasks:
  build:
    desc: Build all packages (compile check only, no binaries kept)
    cmds:
      - go build ./...

  build:memauditd:
    desc: Build the memauditd binary to bin/memauditd
    cmds:
      - go build -o bin/memauditd ./cmd/memauditd

  build:memaudit-synth:
    desc: Build the memaudit-synth binary to bin/memaudit-synth
    cmds:
      - go build -o bin/memaudit-synth ./cmd/memaudit-synth

  test:
    desc: Run tests with the race detector
    cmds:
      - go test ./... -race

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: List files that need gofmt
    cmds:
      - gofmt -l -s .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  reuse-lint:
    desc: Check REUSE/SPDX license compliance
    cmds:
      - reuse lint

  install-test:
    desc: Exercise install.sh end-to-end against faked curl/systemctl (Linux only)
    cmds:
      - bash deploy/install_test.sh

  check-footprint-test:
    desc: Exercise check-footprint.sh end-to-end against faked systemctl/journalctl/du (Linux only)
    cmds:
      - bash deploy/check-footprint-test.sh

  fixtures:
    desc: Capture a golden test fixture tree from this box (run on real target distros)
    cmds:
      - scripts/capture-fixtures.sh {{.CLI_ARGS}}

  snapshot:
    desc: Build a local goreleaser snapshot
    cmds:
      - goreleaser build --snapshot --clean

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf dist/ bin/
