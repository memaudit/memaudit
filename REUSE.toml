version = 1

[[annotations]]
path = ["LICENSE", "LICENSES/**", "NOTICE", "**/README.md", "CONTRIBUTING.md", "SECURITY.md", "CODE_OF_CONDUCT.md", "DCO", ".gitignore", "go.mod", "go.sum", "Taskfile.yml", ".golangci.yml", ".goreleaser.yaml", ".github/**"]
SPDX-FileCopyrightText = "2026 the memaudit authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "testdata/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 the memaudit authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
# Go's native fuzzing writes its persisted corpus to
# <package-dir>/testdata/fuzz/<FuzzName>/, one level down from every
# fuzz-testing package - not the top-level testdata/ the rule above
# covers.
path = "**/testdata/fuzz/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 the memaudit authors"
SPDX-License-Identifier = "Apache-2.0"
