version: 2

project_name: memaudit

before:
  hooks:
    - go mod tidy

builds:
  - id: memauditd
    main: ./cmd/memauditd
    binary: memauditd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

# memaudit-synth isn't implemented yet (cmd/memaudit-synth is still a
# stub) — leave it out of releases until it does something. Re-add a
# build entry for it once it's real.

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  use: github
  # goreleaser's default github format falls back to the raw commit
  # author's name and email when no GitHub login can be resolved (e.g.
  # the first release, with no previous tag to diff against via the
  # API) — never show that; only append an @username when one's
  # actually available, and drop the SHA prefix.
  format: "{{ .Message }}{{ if .Logins }} by {{ .Logins | englishJoin }}{{ end }}"
  # An exclude-based blocklist can't carve out chore(deps) from chore in
  # one regexp (Go's RE2 has no negative lookahead), which meant a
  # release whose only change was a dependency bump -- security fixes
  # included -- got an empty changelog. Switched to an include-based
  # allowlist instead: every type worth surfacing to a reader, named
  # explicitly, with chore(deps) getting its own group so a
  # security-only release still says what changed.
  filters:
    include:
      - '^.*?feat(\(.+\))??!?:.+$'
      - '^.*?fix(\(.+\))??!?:.+$'
      - '^.*?perf(\(.+\))??!?:.+$'
      - '^.*?refactor(\(.+\))??!?:.+$'
      - '^.*?revert(\(.+\))??!?:.+$'
      - '^.*?chore\(deps\):.+$'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Performance improvements"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Dependencies
      regexp: '^.*?chore\(deps\):.+$'
      order: 3
    - title: Others
      order: 999
