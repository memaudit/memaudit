version: 2

project_name: memaudit

before:
  hooks:
    - go mod tidy

builds:
  - id: memauditd
    main: ./cmd/memauditd
    binary: memauditd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}
  - id: memaudit-synth
    main: ./cmd/memaudit-synth
    binary: memaudit-synth
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    ids: [memauditd, memaudit-synth]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    # Explicitly listing files: replaces goreleaser's own default include
    # list (LICENSE*/README*/CHANGELOG*) rather than extending it, so
    # those are repeated here — otherwise the archive would silently stop
    # carrying the license text Apache-2.0 requires on redistribution.
    # memauditd.service/memauditd-zerotouch.service are new: install.sh
    # extracts them alongside the binary so the systemd unit files get
    # the same checksum/signature coverage as the binary, instead of a
    # separate unauthenticated fetch (or, before this, a BASH_SOURCE-based
    # lookup that assumed install.sh was running from a local checkout
    # rather than piped via curl).
    files:
      - LICENSE*
      - LICENSES/**
      - README*
      - CHANGELOG*
      - src: deploy/memauditd.service
        dst: memauditd.service
      - src: deploy/memauditd-zerotouch.service
        dst: memauditd-zerotouch.service

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  use: github
  # goreleaser's default github format falls back to the raw commit
  # author's name and email when no GitHub login can be resolved (e.g.
  # the first release, with no previous tag to diff against via the
  # API) — never show that; only append an @username when one's
  # actually available, and drop the SHA prefix.
  format: "{{ .Message }}{{ if .Logins }} by {{ .Logins | englishJoin }}{{ end }}"
  # An exclude-based blocklist can't carve out chore(deps) from chore in
  # one regexp (Go's RE2 has no negative lookahead), which meant a
  # release whose only change was a dependency bump -- security fixes
  # included -- got an empty changelog. Switched to an include-based
  # allowlist instead: every type worth surfacing to a reader, named
  # explicitly, with chore(deps) getting its own group so a
  # security-only release still says what changed.
  filters:
    include:
      - '^.*?feat(\(.+\))??!?:.+$'
      - '^.*?fix(\(.+\))??!?:.+$'
      - '^.*?perf(\(.+\))??!?:.+$'
      - '^.*?refactor(\(.+\))??!?:.+$'
      - '^.*?revert(\(.+\))??!?:.+$'
      - '^.*?chore\(deps\):.+$'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Performance improvements"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Dependencies
      regexp: '^.*?chore\(deps\):.+$'
      order: 3
    - title: Others
      order: 999
