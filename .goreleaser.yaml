version: 2

project_name: memaudit

before:
  hooks:
    - go mod tidy

builds:
  - id: memauditd
    main: ./cmd/memauditd
    binary: memauditd
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

# memaudit-synth isn't implemented yet (cmd/memaudit-synth is still a
# stub) — leave it out of releases until it does something. Re-add a
# build entry for it once it's real.

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^.*?docs(\(.+\))??!?:.+$'
      - '^.*?test(\(.+\))??!?:.+$'
      - '^.*?chore(\(.+\))??!?:.+$'
      - '^.*?ci(\(.+\))??!?:.+$'
      - '^.*?build(\(.+\))??!?:.+$'
      - '^.*?style(\(.+\))??!?:.+$'
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: "Bug fixes"
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: "Performance improvements"
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999
